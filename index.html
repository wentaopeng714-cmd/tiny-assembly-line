<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Assembly Line</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#181d22;color:#e5e8e9;font:15px system-ui,sans-serif}.app{width:min(1050px,95vw);margin:auto;padding:22px 0}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #3d4b55;padding-bottom:13px}h1{margin:0;color:#f0a65a}.scene{height:170px;margin-top:15px;position:relative;overflow:hidden;border:1px solid #465761;border-radius:12px;background:linear-gradient(#677b88 0 48%,#37444c 48%)}.factory{position:absolute;left:8%;right:8%;bottom:28px;height:75px;background:#303b42;border:5px solid #171c20}.factory:before{content:"";position:absolute;left:7%;right:7%;top:18px;height:27px;background:repeating-linear-gradient(90deg,#f0b15f 0 28px,#192126 28px 36px)}.stack{position:absolute;bottom:98px;width:32px;height:60px;background:#39464d;border:5px solid #171c20}.st1{left:17%}.st2{left:25%;height:82px}.smoke{position:absolute;width:32px;height:22px;border-radius:50%;background:#d6dde0aa;animation:puff 3s infinite}.sm1{left:17%;top:8px}.sm2{left:25%;top:-2px;animation-delay:1.3s}@keyframes puff{to{transform:translate(20px,-35px) scale(1.7);opacity:0}}.mini-belt{position:absolute;left:12%;right:12%;bottom:13px;height:25px;background:repeating-linear-gradient(90deg,#687984 0 22px,#2c353a 22px 38px);animation:roll 1s linear infinite;border:4px solid #151a1e}.crate{position:absolute;bottom:37px;width:28px;height:28px;background:#e09a51;border:4px solid #57341e;animation:crate 7s linear infinite}.c1{animation-delay:0s}.c2{animation-delay:-2.5s}.c3{animation-delay:-5s}@keyframes crate{from{left:9%}to{left:88%}}.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.res,.machine,button,.panel{background:#222a30;border:1px solid #465761;color:#e8ebec;border-radius:7px}.res{padding:11px}.res b{display:block;color:#f2ad64;font-size:20px}.line{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:stretch}.machine{padding:13px;position:relative}.machine h3{margin:0 0 8px}.machine p{color:#aeb9bf;min-height:42px}.machine button,header button,.panel button{padding:9px;width:100%;cursor:pointer;font-weight:800}.belt{height:12px;background:repeating-linear-gradient(90deg,#52636d 0 16px,#303a40 16px 30px);margin:18px 0;animation:roll 1s linear infinite}@keyframes roll{to{background-position:30px}}.panel{padding:15px;margin-top:14px}.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.order{padding:11px;background:#192126;border-radius:6px}.order button{margin-top:8px}.bar{height:8px;background:#101519;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#ee9d52}.overlay{position:fixed;inset:0;background:#101419e8;display:grid;place-items:center;padding:20px}.modal{max-width:460px;background:#222a30;border:1px solid #526671;border-radius:12px;padding:28px;text-align:center}.hide{display:none}@media(max-width:760px){.line{grid-template-columns:1fr 1fr}.resources{grid-template-columns:1fr 1fr}.orders{grid-template-columns:1fr}header{gap:12px}.scene{height:135px}.factory{bottom:20px}.mini-belt{bottom:7px}.crate{bottom:31px}}
</style></head><body><div class="app"><header><div><h1>Tiny Assembly Line</h1><small>Build, balance, and automate a pocket factory</small></div><button id="sound">♪ ON</button></header><div class="scene" aria-hidden="true"><div class="stack st1"></div><div class="stack st2"></div><i class="smoke sm1"></i><i class="smoke sm2"></i><div class="factory"></div><div class="mini-belt"></div><i class="crate c1"></i><i class="crate c2"></i><i class="crate c3"></i></div><div class="resources"><div class="res">Ore<b id="ore">0</b></div><div class="res">Plates<b id="plates">0</b></div><div class="res">Gears<b id="gears">0</b></div><div class="res">Credits<b id="credits">20</b></div></div><div class="belt"></div><div class="line" id="line"></div><div class="panel"><h2>Shipping orders</h2><div class="orders" id="orders"></div></div></div><div class="overlay" id="overlay"><div class="modal"><h2>Tiny Assembly Line</h2><p>Buy machines for each production stage. Miners create ore, presses make plates, cutters make gears, and packers turn finished parts into steady credits.</p><button id="start">START THE BELT</button></div></div><script>
const $=s=>document.querySelector(s);let S={ore:0,plates:0,gears:0,credits:20,m:[0,0,0,0],last:Date.now()},sound=true,audio,musicTimer,step=0,run=false;const defs=[['Miner',10,'Produces 1 ore/sec'],['Press',25,'Turns ore into plates'],['Gear Cutter',60,'Turns plates into gears'],['Packer',120,'Sells gears automatically']],orders=[[10,0,0,25],[0,8,0,60],[0,0,5,140]];
function tone(f,d=.07,v=.014){if(!sound)return;audio=audio||new AudioContext;if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function music(){clearInterval(musicTimer);tone(130);document.body.dataset.music='on';let n=[130,165,196,165,147,196];musicTimer=setInterval(()=>tone(n[step++%n.length],.09,.006),300)}function stopMusic(){clearInterval(musicTimer);document.body.dataset.music='off'}function cost(i){return Math.ceil(defs[i][1]*Math.pow(1.45,S.m[i]))}function fmt(n){return n<1000?Math.floor(n):(n/1000).toFixed(1)+'K'}
function render(){['ore','plates','gears','credits'].forEach(k=>$('#'+k).textContent=fmt(S[k]));$('#line').innerHTML='';defs.forEach((d,i)=>{let c=cost(i),el=document.createElement('div');el.className='machine';el.innerHTML=`<h3>${d[0]} Lv.${S.m[i]}</h3><p>${d[2]}</p><div class="bar"><i style="width:${Math.min(100,S.m[i]*15)}%"></i></div><button ${S.credits<c?'disabled':''}>UPGRADE ${c}</button>`;el.querySelector('button').onclick=()=>{if(S.credits>=c){S.credits-=c;S.m[i]++;tone(480);render()}};$('#line').appendChild(el)});$('#orders').innerHTML='';orders.forEach((o,i)=>{let ok=S.ore>=o[0]&&S.plates>=o[1]&&S.gears>=o[2],el=document.createElement('div');el.className='order';el.innerHTML=`Order ${i+1}<br><small>${o[0]} ore · ${o[1]} plates · ${o[2]} gears</small><br><b>+${o[3]} credits</b><button ${ok?'':'disabled'}>SHIP</button>`;el.querySelector('button').onclick=()=>{S.ore-=o[0];S.plates-=o[1];S.gears-=o[2];S.credits+=o[3];tone(700,.16,.03);render()};$('#orders').appendChild(el)})}
function tick(dt){if(!run)return;S.ore+=S.m[0]*dt;let p=Math.min(S.ore,S.m[1]*.65*dt);S.ore-=p;S.plates+=p;let g=Math.min(S.plates,S.m[2]*.42*dt);S.plates-=g;S.gears+=g;let sell=Math.min(S.gears,S.m[3]*.28*dt);S.gears-=sell;S.credits+=sell*5;render()}$('#start').onclick=()=>{$('#overlay').classList.add('hide');run=true;music()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♪ ON':'♪ OFF';sound?music():stopMusic()};function save(){S.last=Date.now();localStorage.tinyAssembly=JSON.stringify(S)}function load(){try{let v=JSON.parse(localStorage.tinyAssembly);if(v)S=v}catch{}let away=Math.min(7200,(Date.now()-S.last)/1000);let old=run;run=true;tick(away*.35);run=old;render()}setInterval(()=>tick(.2),200);setInterval(save,3000);addEventListener('beforeunload',save);load();
</script></body></html>
